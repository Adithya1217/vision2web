services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: msme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      MSME_ENVIRONMENT: ${MSME_ENVIRONMENT:-development}
      MSME_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/msme
      MSME_JWT_SECRET: ${MSME_JWT_SECRET:-change-me-in-production}
      MSME_CORS_ORIGINS: '["http://localhost:3000"]'
      MSME_ANTHROPIC_API_KEY: ${MSME_ANTHROPIC_API_KEY:-}
      MSME_GEMINI_API_KEY: ${MSME_GEMINI_API_KEY:-}
      MSME_SARVAM_API_KEY: ${MSME_SARVAM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
